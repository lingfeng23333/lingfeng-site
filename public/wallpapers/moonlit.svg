<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f8ff"/>
      <stop offset="0.6" stop-color="#e8f0ff"/>
      <stop offset="1" stop-color="#fdeef4"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="1" stop-color="#ffe6a8"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1150" cy="230" r="120" fill="#ffe9a8" opacity="0.35" filter="url(#glow)"/>
  <circle cx="1150" cy="230" r="78" fill="url(#moon)"/>
  <g fill="#ffffff" opacity="0.9">
