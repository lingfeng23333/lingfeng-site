  </g>
  <g fill="#8fa3c8">
    <circle cx="150" cy="150" r="2" opacity="0.8"/>
    <circle cx="430" cy="100" r="1.6" opacity="0.7"/>
    <circle cx="720" cy="210" r="2.2" opacity="0.75"/>
    <circle cx="940" cy="130" r="1.6" opacity="0.6"/>
    <circle cx="300" cy="340" r="1.8" opacity="0.7"/>
    <circle cx="850" cy="370" r="1.4" opacity="0.6"/>
    <circle cx="1420" cy="430" r="2" opacity="0.7"/>
  </g>
</svg>
